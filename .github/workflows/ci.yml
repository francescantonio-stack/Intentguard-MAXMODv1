# The "judge": every PR must pass these checks before merge (agents and humans alike).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: ts (core, signer, mcp, web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @intentguard/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  evm:
    name: evm (forge test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/evm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1 # foundry.toml needs >= 1.8 (network = "monad"); the "stable" tag is older and fails the P256 tests
      - run: forge --version
      - run: forge test -vv

  near:
    name: near (cargo test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/near-policy
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/near-policy
      - run: cargo test --lib

  secrets:
    name: secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks binary scans every commit with our config; no PR API access or license needed.
      - run: curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
      - run: ./gitleaks git --config .gitleaks.toml --redact --no-banner .
