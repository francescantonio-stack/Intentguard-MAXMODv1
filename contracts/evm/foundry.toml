[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
# Monad execution semantics (gas, precompiles incl. P256 at 0x0100). Requires Foundry >= 1.8.0.
network = "monad"
remappings = ["solady/=lib/solady/src/", "forge-std/=lib/forge-std/src/"]
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read-write", path = "../../deployments" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
base_sepolia = "https://sepolia.base.org"
