[package]
name = "intentguard-policy"
version = "0.1.0"
edition = "2021"
description = "IntentGuard policy contract: allowlist + weekly cap + plan commitments in front of NEAR Chain Signatures (testnet only)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }
near-workspaces = { version = "0.23", default-features = false, features = ["install"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
