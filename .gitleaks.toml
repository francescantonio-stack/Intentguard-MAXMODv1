# Extends the default rules. Public EVM addresses (20 bytes) are not secrets; forge deps are submodules.
[extend]
useDefault = true
[allowlist]
description = "public addresses and third-party submodules"
regexes = [
  '''^0x[0-9a-fA-F]{40}$''',
  # PUBLIC root key of the NEAR testnet MPC signer (v1.signer-prod.testnet), used for address derivation
  '''^04a8bb8176747682aab5c681d4ef375ca537023b2b287d8b5f9d89505277a5a291538ef3680882d8fb793a62a5fdb4c6974c7cd8f9eb0b9cbbf659314c30347000$''',
]
paths = ['''contracts/evm/lib/''']
